<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSON to Neuroglancer URL</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #333; }
        textarea { width: 100%; height: 220px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; margin-bottom: 10px; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; background: #24292e; color: white; margin-right: 10px; }
        button:hover { background: #444; }
        #copyBtn, #openBtn { display: none; }
        #copyBtn { background: #0969da; }
        #openBtn { background: #1a7f37; }
        .error { color: #cf222e; background: #ffebe9; padding: 12px; border-radius: 6px; display: none; margin-bottom: 20px; border: 1px solid #d0d7de; }
        .output-container { margin-top: 20px; }
        .label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.9em; color: #555; }
        #urlOutput {
            background: #f6f8fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
            min-height: 2em;
            max-height: 60vh;
            overflow: auto;
        }
        #urlOutput a {
            color: #0969da;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h2>JSON → Neuroglancer URL Converter</h2>
    <div id="errorBox" class="error"></div>

    <label class="label">Paste Neuroglancer JSON state:</label>
    <textarea id="jsonInput" placeholder='{"dimensions": {...}, "layers": [...]}'></textarea>

    <div class="controls">
        <button onclick="convertToUrl()">Convert to URL</button>
        <button id="copyBtn" onclick="copyToClipboard()">Copy URL</button>
        <button id="openBtn" onclick="openUrl()">Open URL</button>
    </div>

    <div class="output-container">
        <label class="label">Generated Neuroglancer URL:</label>
        <div id="urlOutput">Awaiting conversion...</div>
    </div>

    <script>
        let latestUrlText = "";

        function convertToUrl() {
            const jsonInput = document.getElementById('jsonInput').value.trim();
            const output = document.getElementById('urlOutput');
            const errorBox = document.getElementById('errorBox');
            const copyBtn = document.getElementById('copyBtn');
            const openBtn = document.getElementById('openBtn');

            errorBox.style.display = "none";
            copyBtn.style.display = "none";
            openBtn.style.display = "none";
            latestUrlText = "";

            try {
                if (!jsonInput) {
                    throw new Error("Please paste a JSON state first.");
                }

                const parsed = JSON.parse(jsonInput);
                const compactJson = JSON.stringify(parsed);
                const encodedState = encodeURIComponent(compactJson);

                latestUrlText = `https://neuroglancer-demo.appspot.com/#!${encodedState}`;
                output.innerHTML = `<a href="${latestUrlText}" target="_blank" rel="noopener noreferrer">${latestUrlText}</a>`;
                copyBtn.style.display = "inline-block";
                openBtn.style.display = "inline-block";
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = "block";
                output.textContent = "Error occurred.";
            }
        }

        function copyToClipboard() {
            if (!latestUrlText) return;
            navigator.clipboard.writeText(latestUrlText).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = "Copied!";
                setTimeout(() => btn.textContent = originalText, 1500);
            });
        }

        function openUrl() {
            if (!latestUrlText) return;
            window.open(latestUrlText, '_blank', 'noopener,noreferrer');
        }
    </script>
</body>
</html>
