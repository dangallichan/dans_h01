<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://unpkg.com/tabulator-tables/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables/dist/js/tabulator.min.js"></script>
</head>
<body>
    <h2>Interactive Data Table</h2>
    <div id="data-table"></div>

    <script>
        async function loadData() {
            // 1. Fetch the JSONL file from your GitHub Pages URL
            const response = await fetch('https://dangallichan.github.io/dans_h01/merged_df_DG.jsonl');
            const text = await response.text();

            // 2. Parse JSONL to a JavaScript Array
            const jsonData = text.trim().split('\n').map(line => JSON.parse(line));

            // 3. Initialize the Interactive Table
            new Tabulator("#data-table", {
                data: jsonData,
                autoColumns: true, // Automatically creates columns based on JSON keys
                layout: "fitColumns",
                pagination: "local",
                paginationSize: 10,
                movableColumns: true,
                initialSort: [{column: "id", dir: "asc"}], // Optional default sort
            });
        }

        loadData();
    </script>
</body>
</html>
