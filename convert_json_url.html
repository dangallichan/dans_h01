<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neuroglancer URL to JSON</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #333; }
        textarea { width: 100%; height: 90px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; margin-bottom: 10px; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; background: #24292e; color: white; margin-right: 10px; }
        button:hover { background: #444; }
        #copyBtn, #downloadBtn { display: none; }
        #copyBtn { background: #0969da; }
        #downloadBtn { background: #1a7f37; }
        .error { color: #cf222e; background: #ffebe9; padding: 12px; border-radius: 6px; display: none; margin-bottom: 20px; border: 1px solid #d0d7de; }
        .output-container { margin-top: 20px; }
        .label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.9em; color: #555; }
        #jsonOutput {
            background: #f6f8fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
            min-height: 2em;
            max-height: 60vh;
            overflow: auto;
        }
    </style>
</head>
<body>

    <h2>Neuroglancer URL → JSON Converter</h2>
    <div id="errorBox" class="error"></div>

    <label class="label">Paste Neuroglancer URL:</label>
    <textarea id="urlInput" placeholder="https://neuroglancer...#!{...}"></textarea>

    <div class="controls">
        <button onclick="convertToJson()">Convert to JSON</button>
        <button id="copyBtn" onclick="copyToClipboard()">Copy JSON</button>
        <button id="downloadBtn" onclick="downloadJson()">Download .json</button>
    </div>

    <div class="output-container">
        <label class="label">Decoded JSON:</label>
        <div id="jsonOutput">Awaiting conversion...</div>
    </div>

    <script>
        let latestJsonText = "";

        function convertToJson() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const output = document.getElementById('jsonOutput');
            const errorBox = document.getElementById('errorBox');
            const copyBtn = document.getElementById('copyBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            errorBox.style.display = "none";
            copyBtn.style.display = "none";
            downloadBtn.style.display = "none";
            latestJsonText = "";

            try {
                const hashIndex = urlInput.indexOf('#!');
                if (hashIndex === -1) {
                    throw new Error("Invalid URL: Missing '#!' fragment.");
                }

                const encodedState = urlInput.substring(hashIndex + 2);
                const decodedState = decodeURIComponent(encodedState);
                const parsed = JSON.parse(decodedState);

                latestJsonText = JSON.stringify(parsed, null, 2);
                output.textContent = latestJsonText;
                copyBtn.style.display = "inline-block";
                downloadBtn.style.display = "inline-block";
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = "block";
                output.textContent = "Error occurred.";
            }
        }

        function copyToClipboard() {
            if (!latestJsonText) return;
            navigator.clipboard.writeText(latestJsonText).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = "Copied!";
                setTimeout(() => btn.textContent = originalText, 1500);
            });
        }

        function downloadJson() {
            if (!latestJsonText) return;
            const blob = new Blob([latestJsonText], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'neuroglancer_state.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
