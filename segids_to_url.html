<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seg IDs → Neuroglancer URL</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        textarea { width: 100%; height: 140px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; margin-bottom: 10px; box-sizing: border-box; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; background: #24292e; color: white; margin-right: 10px; }
        button:hover { background: #444; }
        #copyBtn { background: #0969da; display: none; }
        #openBtn { background: #1a7f37; display: none; }
        .error { color: #cf222e; background: #ffebe9; padding: 12px; border-radius: 6px; display: none; margin-bottom: 20px; border: 1px solid #d0d7de; }
        .output-container { margin-top: 20px; }
        .label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.9em; color: #555; }
        #urlOutput {
            background: #f6f8fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
            min-height: 1.5em;
            max-height: 60vh;
            overflow: auto;
        }
        #urlOutput a { color: #0969da; text-decoration: underline; }
        .count { font-size: 0.85em; color: #666; margin-top: 6px; }
    </style>
</head>
<body>

    <h2>Seg IDs → Neuroglancer URL</h2>
    <p style="color:#555; font-size:0.92em; margin-top:-10px;">Paste segment IDs (one per line, or comma/space separated). They will be loaded into the c3 segmentation layer using the basis state template.</p>
    <div id="errorBox" class="error"></div>

    <label class="label">Segment IDs:</label>
    <textarea id="segInput" placeholder="2714457325&#10;1900905433&#10;3812058320&#10;..."></textarea>

    <div class="controls">
        <button onclick="generateUrl()">Generate URL</button>
        <button id="copyBtn" onclick="copyToClipboard()">Copy URL</button>
        <button id="openBtn" onclick="openUrl()">Open in Neuroglancer</button>
    </div>

    <div class="output-container">
        <label class="label">Neuroglancer URL:</label>
        <div id="urlOutput">Awaiting input...</div>
        <div id="countDisplay" class="count"></div>
    </div>

    <script>
        let latestUrlText = "";

        async function generateUrl() {
            const raw = document.getElementById('segInput').value;
            const output = document.getElementById('urlOutput');
            const errorBox = document.getElementById('errorBox');
            const copyBtn = document.getElementById('copyBtn');
            const openBtn = document.getElementById('openBtn');
            const countDisplay = document.getElementById('countDisplay');

            errorBox.style.display = "none";
            copyBtn.style.display = "none";
            openBtn.style.display = "none";
            countDisplay.textContent = "";
            latestUrlText = "";

            try {
                // Parse IDs: split on whitespace and/or commas, drop empties
                const ids = raw.split(/[\s,]+/).map(s => s.trim()).filter(s => s.length > 0);

                if (ids.length === 0) {
                    throw new Error("No segment IDs found. Paste at least one ID.");
                }

                // Validate all entries look like numbers
                for (const id of ids) {
                    if (!/^\d+$/.test(id)) {
                        throw new Error(`Invalid segment ID: "${id}". IDs should be numeric.`);
                    }
                }

                // Load the basis state
                const response = await fetch('neuroglancer_basis_state.json');
                if (!response.ok) throw new Error("Could not load neuroglancer_basis_state.json.");
                const state = await response.json();

                // Find the c3 segmentation layer and replace its segments
                const c3Layer = state.layers.find(l => l.name === "c3 segmentation");
                if (!c3Layer) throw new Error("Could not find 'c3 segmentation' layer in basis state.");

                c3Layer.segments = ids;

                // Build URL
                const encodedState = encodeURIComponent(JSON.stringify(state));
                latestUrlText = `https://neuroglancer-demo.appspot.com/#!${encodedState}`;

                output.innerHTML = `<a href="${latestUrlText}" target="_blank" rel="noopener noreferrer">${latestUrlText}</a>`;
                copyBtn.style.display = "inline-block";
                openBtn.style.display = "inline-block";
                countDisplay.textContent = `${ids.length} segment ID${ids.length !== 1 ? 's' : ''} loaded.`;

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = "block";
                output.textContent = "Error occurred.";
            }
        }

        function copyToClipboard() {
            if (!latestUrlText) return;
            navigator.clipboard.writeText(latestUrlText).then(() => {
                const btn = document.getElementById('copyBtn');
                const orig = btn.textContent;
                btn.textContent = "Copied!";
                setTimeout(() => btn.textContent = orig, 1500);
            });
        }

        function openUrl() {
            if (!latestUrlText) return;
            window.open(latestUrlText, '_blank', 'noopener,noreferrer');
        }
    </script>
</body>
</html>
