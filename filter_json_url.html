<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neuroglancer Line Updater</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        textarea { width: 100%; height: 80px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; margin-bottom: 10px; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; background: #24292e; color: white; }
        button:hover { background: #444; }
        #copyBtn { background: #0969da; display: none; margin-left: 10px; }
        .error { color: #cf222e; background: #ffebe9; padding: 12px; border-radius: 6px; display: none; margin-bottom: 20px; border: 1px solid #d0d7de; }
        .output-container { margin-top: 20px; }
        .label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.9em; color: #555; }
        #singleLineOutput { 
            background: #f6f8fa; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #d0d7de; 
            font-family: monospace; 
            word-break: break-all; 
            font-size: 13px;
            min-height: 1.5em;
        }
    </style>
</head>
<body>

    <h2>Neuroglancer Line Generator</h2>
    <div id="errorBox" class="error"></div>
    
    <label class="label">Paste Neuroglancer URL:</label>
    <textarea id="urlInput" placeholder="https://neuroglancer...#!{...}"></textarea>

    <div class="controls">
        <button onclick="processLine()">Generate Updated Line</button>
        <button id="copyBtn" onclick="copyToClipboard()">Copy to Clipboard</button>
    </div>

    <div class="output-container">
        <label class="label">Single Line JSON (for GitHub Issue):</label>
        <div id="singleLineOutput">Awaiting processing...</div>
    </div>

    <script>
        async function processLine() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const output = document.getElementById('singleLineOutput');
            const errorBox = document.getElementById('errorBox');
            const copyBtn = document.getElementById('copyBtn');

            errorBox.style.display = "none";
            copyBtn.style.display = "none";
            
            try {
                // 1. Parse URL State
                const hashIndex = urlInput.indexOf('#!');
                if (hashIndex === -1) throw new Error("Invalid URL: Missing '#!' fragment.");
                const decoded = decodeURIComponent(urlInput.substring(hashIndex + 2));
                const activeSegments = JSON.parse(decoded).layers[1].segments
                    .map(s => String(s)).filter(s => !s.startsWith('!'));

                // 2. Fetch the JSONL file
                const response = await fetch('merged_df_DG.jsonl');
                if (!response.ok) throw new Error("Could not find 'merged_df_DG.jsonl'.");
                
                const fileText = await response.text();
                const jsonlObjects = fileText.split('\n').filter(l => l.trim()).map(l => JSON.parse(l));

                // 3. Match unique c3_id
                let matchedObj = null;
                let foundC3Id = null;

                for (const obj of jsonlObjects) {
                    const currentId = String(obj.c3_id);
                    if (activeSegments.includes(currentId)) {
                        if (matchedObj) throw new Error("Ambiguity: Multiple rows match these segments.");
                        matchedObj = obj;
                        foundC3Id = currentId;
                    }
                }

                if (!matchedObj) throw new Error("No matching c3_id found in the data.");

                // 4. Create the modified single line
                matchedObj['DG_extraManualSegs'] = activeSegments.filter(s => s !== foundC3Id);
                
                const resultLine = JSON.stringify(matchedObj);
                output.textContent = resultLine;
                copyBtn.style.display = "inline-block";

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = "block";
                output.textContent = "Error occurred.";
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('singleLineOutput').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = "Copied!";
                setTimeout(() => btn.textContent = originalText, 2000);
            });
        }
    </script>
</body>
</html>
