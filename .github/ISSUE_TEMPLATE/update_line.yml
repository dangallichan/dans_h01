name: Update JSONL Line
title: "[Update JSONL Line]: " 
description: Paste one or more new lines to replace existing ones in the data file. c3_id will be extracted automatically from each line.
body:
  - type: textarea
    id: new_content
    attributes:
      label: New JSON Line(s)
      description: Paste one or more complete JSON lines here. The c3_id will be extracted automatically from each line.
      placeholder: |
        {"c3_id": 123, "field1": "value1", ...}
        {"c3_id": 456, "field1": "value2", ...}
    validations:
      required: true